<div class="container">
  <div data-ng-controller="HeaderController">

    <div class="navbar-header">
      <button type="button"
              class="navbar-toggle"
              data-toggle="collapse"
              data-target=".navbar-collapse"
              data-ng-click="$root.isCollapsed = !$root.isCollapsed">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>

      <a class="insight navbar-brand" data-ng-href="{{languagePrefix}}/">Sumcoin Explorer</a>
    </div>

    <div class="navbar-collapse collapse"
         collapse="$root.isCollapsed">

      <ul class="nav navbar-nav">

        <li ui-route="/blocks"
            data-ng-class="{active:$uiRoute}">
          <a data-ng-href="{{languagePrefix}}/blocks"><span translate>Blocks</span></a>
        </li>

        <li ui-route="/status"
            data-ng-class="{active:$uiRoute}">
          <a data-ng-href="{{languagePrefix}}/status"><span translate>Status</span></a>
        </li>

        <li ui-route="/api-docs"
            data-ng-class="{active:$uiRoute}">
          <a data-ng-href="{{languagePrefix}}/api-docs">
            <span class="glyphicon glyphicon-transfer"></span>
            API
          </a>
        </li>

        <li class="dropdown">
          <a href="#"
             class="dropdown-toggle"
             data-toggle="dropdown">
            <span translate>Tools</span> <span class="caret"></span>
          </a>

          <ul class="dropdown-menu">
            <li>
              <a data-ng-href="{{languagePrefix}}/tx/send">
                <span class="glyphicon glyphicon-send"></span>
                <span translate>Broadcast Transaction</span>
              </a>
            </li>

            <li>
              <a data-ng-href="{{languagePrefix}}/messages/verify">
                <span class="glyphicon glyphicon-ok-circle"></span>
                <span translate>Verify Message</span>
              </a>
            </li>

            <li class="divider"></li>

            <li>
              <a href=""
                 data-ng-click="$event.preventDefault(); openScannerModal()">
                <span class="glyphicon glyphicon-qrcode"></span>
                <span translate>Scan QR Code</span>
              </a>
            </li>
          </ul>
        </li>

      </ul>

      <span class="hidden-xs navbar-form navbar-left"
            data-ng-include
            src="'views/includes/search.html'"></span>

      <ul class="nav navbar-nav navbar-right">

        <li>
          <div class="status"
               data-ng-controller="StatusController">

            <div data-ng-init="getSync()"
                 class="pull-left">

              <span class="t text-danger"
                    data-ng-show="sync.error"
                    tooltip="{{sync.error}}">
                <span class="glyphicon glyphicon-warning-sign"></span>
                ERROR
              </span>

              <span class="t"
                    data-ng-show="sync.status==='syncing'"
                    tooltip="{{sync.syncPercentage}}% synced">
                <span class="glyphicon glyphicon-refresh icon-rotate"></span>
                {{sync.syncPercentage}}%
              </span>

              <span class="glyphicon glyphicon-ok"
                    data-ng-show="sync.status==='finished'"
                    tooltip="Blockchain synced"></span>
            </div>

            &nbsp;&middot;&nbsp;
<span data-ng-init="getStatus('Info')">
              <strong>Conn</strong>
              {{info.connections !== undefined ? info.connections : 0}}
            </span>

            &nbsp;&middot;&nbsp;

            <strong translate>Height</strong>
            {{(totalBlocks || info.blocks) | number:0}}

          </div>
        </li>

        <li class="dropdown"
            data-ng-controller="CurrencyController"
            data-ng-include="'views/includes/currency.html'">
        </li>

      </ul>

    </div>
  </div>
</div>
